name: MemoryVerse AI CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # CONTINUOUS INTEGRATION
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest --import-mode=importlib

  # CONTINUOUS DELIVERY
  deploy:
    name: Deploy to Production
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Deploy Backend
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error "$DEPLOY_HOOK"

      - name: Deploy Frontend
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error "$DEPLOY_HOOK"

      - name: Verify Backend Deployment
        run: |
          echo "Checking backend health..."

          for i in {1..60}; do
            if curl --fail --silent https://memoryverse-ai-603s.onrender.com/health; then
              echo "Backend deployment verified successfully!"
              exit 0
            fi

            echo "Backend is not ready. Retrying in 10 seconds..."
            sleep 10
          done

          echo "Backend health check failed!"
          exit 1

      - name: Verify Frontend Deployment
        run: |
          echo "Checking frontend availability..."

          for i in {1..60}; do
            if curl --fail --silent --output /dev/null https://memoryverse-ai-frontend.onrender.com; then
              echo "Frontend deployment verified successfully!"
              exit 0
            fi

            echo "Frontend is not ready. Retrying in 10 seconds..."
            sleep 10
          done

          echo "Frontend health check failed!"
          exit 1